spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: USER-SERVICE
  datasource:
    url: jdbc:mysql://${SERVERS:localhost}:3306/Stock_Test_User?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${TEST_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: localhost
    username: no-reply@stock.test
    port: 2525
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost}:${KAFKA_PORT:9092}
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: stock.user_service.kafka
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8086
  ssl:
    enabled: false

logging:
  level:
    '[org.springframework]': INFO
    '[stock.user_service]': DEBUG
    'stock.user_service.client.NewsfeedServiceClient': DEBUG

app:
  domain: test.local
  jwt:
    secret: test-user-service-jwt-secret-for-local-and-ci-only-123456
    accessTokenExpirationInMs: 900000
    refreshTokenExpirationInMs: 604800000
  upload:
    dir: build/test-uploads/profile_images
    url: http://test.local/uploads/profile_images

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: false
    register-with-eureka: false
  instance:
    preferIpAddress: true
    securePortEnabled: false
    nonSecurePortEnabled: true

feign:
  client:
    config:
      default:
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      newsfeedService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      newsfeedService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException

test:
  email: portfolio-user@stock.test
