server:
  port: 8081
  ssl:
    enabled: false

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: API-GATEWAY

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: false
    register-with-eureka: false
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

app:
  jwt:
    secret: test-gateway-jwt-secret-for-local-and-ci-only-123456
    expirationInMs: 3600000

jwt:
  secret: test-gateway-jwt-secret-for-local-and-ci-only-123456

resilience4j:
  thread-pool-bulkhead:
    enabled: false
  ratelimiter:
    instances:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: PT1S
        timeoutDuration: PT0.1S
